name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, customer, notification, product, shopping-cart]
    defaults:
      run:
        working-directory: backend-services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Pinned to v5: gradle/actions@v6 moves caching into the proprietary
      # gradle-actions-caching component under Gradle's Terms of Use. See PIN-253.
      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: backend-services/${{ matrix.service }}/build/test-results/test/
          retention-days: 7

  frontend-tests:
    name: Frontend · customer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-apps/customer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend-apps/customer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # The admin app is TanStack Start scaffolding with no tests yet, so this job
  # gates on lint, typecheck and build rather than pretending test coverage
  # exists. All three catch the failure mode that matters here: a dependency
  # upgrade breaking the app. Add a test step once admin has real features.
  # See PIN-253.
  admin-build:
    name: Frontend · admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-apps/admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend-apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Static checks only. The Cucumber suite itself is deliberately NOT run here:
  # it needs the full Docker stack and takes ~6 minutes, so it stays a
  # local-only gate (./scripts/run-acceptance-tests.sh). typecheck, lint and
  # format need no stack and finish in seconds, which is the whole reason they
  # are worth running in CI even though the suite is excluded. Do not add a
  # step that runs the features here. See PIN-252.
  #
  # typecheck and lint are continue-on-error on purpose. This package carries
  # pre-existing debt -- 129 tsc errors and 39 eslint errors / 30 warnings as
  # of this commit -- tracked in PIN-258. Gating on them today would leave CI
  # permanently red and block unrelated PRs, so they report without failing,
  # which still surfaces the counts on every PR and catches a sudden jump.
  # Once PIN-258 lands, delete the two continue-on-error lines to arm them.
  #
  # format:check gates for real: `bun run format` cleared all 13 previously
  # unformatted files, and prettier 3.4.2, 3.7.4 and 3.9.8 all agree the result
  # is clean, so this holds whichever version the lockfile resolves.
  #
  # The blocking step runs last by design. A failing step halts the job, so
  # putting format:check first would skip the typecheck/lint reporting that is
  # the reason this job exists.
  acceptance-tests-checks:
    name: Acceptance tests · static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acceptance-tests
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Lint
        continue-on-error: true
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

  # .agents/skills (Codex) and .claude/skills (Claude Code) are hand-maintained
  # copies of the same files, and they have drifted twice — most recently when
  # the acceptance suite moved to Bun in #110 while the .agents copy kept
  # documenting npm, which would send an agent to run the wrong package manager.
  # Nothing errors when they diverge; the stale copy simply reads as
  # authoritative. This fails the PR instead.
  #
  # PIN-271 proposes symlinking one to the other, which would make divergence
  # structurally impossible. That is blocked on verifying Codex follows
  # symlinked skill directories — if it does not, the link yields no skills at
  # all, which is worse. Until that is tested with a real Codex run, this check
  # is the portable guard. It stays true if the symlink later lands.
  agent-skills-sync:
    name: Agent skills · in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: .agents/skills must match .claude/skills
        run: diff -r .claude/skills .agents/skills
