name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, customer, notification, product]
    defaults:
      run:
        working-directory: backend-services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Pinned to v5: gradle/actions@v6 moves caching into the proprietary
      # gradle-actions-caching component under Gradle's Terms of Use. See PIN-253.
      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: backend-services/${{ matrix.service }}/build/test-results/test/
          retention-days: 7

  frontend-tests:
    name: Frontend · customer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-apps/customer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend-apps/customer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # The admin app is TanStack Start scaffolding with no tests yet, so this job
  # gates on lint, typecheck and build rather than pretending test coverage
  # exists. All three catch the failure mode that matters here: a dependency
  # upgrade breaking the app. Add a test step once admin has real features.
  # See PIN-253.
  admin-build:
    name: Frontend · admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-apps/admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend-apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Runs the @smoke subset (69 scenarios, 561 steps) of the Cucumber/Playwright
  # acceptance suite against the full stack: 20 containers across both compose
  # files, plus five images built from source.
  #
  # NON-BLOCKING ON PURPOSE (continue-on-error). This is the first time the full
  # stack has run in CI, and a heavyweight job that fails for environmental
  # reasons should not wedge unrelated PRs while we learn how it behaves. Drop
  # the flag and promote it to a required check once it is proven stable across
  # a few runs. See PIN-253.
  #
  # Uses docker compose directly rather than scripts/docker-manage.sh: that
  # script is zsh (not present on ubuntu-latest by default) and is written for
  # interactive local use.
  #
  # The two compose files MUST be brought up separately, not merged with
  # `-f a -f b`. docker-compose.yml creates acme-network; docker-compose.apps.yml
  # declares the same network `external: true`. Merging lets the external
  # declaration win, and compose then refuses to create the network at all,
  # failing with "network acme-network declared as external, but could not be
  # found". This does not reproduce on a developer machine that already has the
  # network left over from a previous run -- only on a clean runner.
  #
  # Measured cost: building all five images took ~4m30s on a cold ubuntu-latest
  # runner, better than the Containerfile structure suggests (each downloads
  # Gradle inside the image and runs a full `gradle build`, with `COPY src`
  # before that RUN so the layer always invalidates). Revisit buildx with a
  # GitHub Actions layer cache only if that number grows.
  acceptance-smoke:
    name: Acceptance · @smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      INFRA: -f docker-compose.yml
      APPS: -f docker-compose.apps.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: acceptance-tests/package-lock.json

      # Creates acme-network, which the apps compose file expects to exist.
      - name: Start infrastructure
        run: docker compose ${INFRA} up -d --wait

      - name: Build images and start application services
        run: docker compose ${APPS} up -d --build

      # Deliberately not `up --wait`: that treats ANY container exiting as a
      # failure, including the one-shot *-db-init containers that correctly exit
      # 0 once they have created their database. The first run failed exactly
      # that way ("container acme-product-db-init exited (0)") after every
      # service had already reported healthy. Poll the long-running services
      # instead.
      - name: Wait for application services to be healthy
        run: |
          services="acme-identity-service acme-customer-service acme-notification-service acme-product-service acme-customer-frontend"
          deadline=$(( SECONDS + 300 ))
          while :; do
            pending=""
            for c in $services; do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
              [ "$status" = healthy ] || pending="$pending $c($status)"
            done
            if [ -z "$pending" ]; then
              echo "All application services healthy."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out after 300s waiting for:$pending"
              exit 1
            fi
            echo "waiting for:$pending"
            sleep 5
          done

      - name: Show service status
        run: |
          docker compose ${INFRA} ps
          docker compose ${APPS} ps

      - name: Install acceptance-test dependencies
        working-directory: acceptance-tests
        run: npm ci

      - name: Install Playwright browser
        working-directory: acceptance-tests
        run: npx playwright install --with-deps chromium

      - name: Run @smoke suite
        working-directory: acceptance-tests
        run: npm run test:smoke

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose ${APPS} logs --no-color --tail=200 || true
          docker compose ${INFRA} logs --no-color --tail=100 || true

      - name: Upload acceptance reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-smoke-reports
          path: acceptance-tests/reports/
          retention-days: 7
          if-no-files-found: ignore

      # Apps first, then infra -- infra owns acme-network and cannot remove it
      # while app containers are still attached. `|| true` so a failure in the
      # first teardown does not skip the second.
      - name: Tear down
        if: always()
        run: |
          docker compose ${APPS} down -v --remove-orphans || true
          docker compose ${INFRA} down -v --remove-orphans || true
