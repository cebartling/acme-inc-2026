# =============================================================================
# Prometheus Configuration
# Metrics collection and storage for OpenTelemetry
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: acme-local
    env: development

# Alertmanager (PIN-495): notifies the receiver in docker/alertmanager/config/alertmanager.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Rule files for recording and alerting rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Grafana metrics
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  # Loki metrics
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # Tempo metrics
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  # Alertmanager metrics (PIN-495): up{job="alertmanager"} and notification failure counters
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # Backend service metrics at /actuator/prometheus (order PIN-493, the rest PIN-537). With only
  # docker-compose.yml running these targets do not exist, so ServiceDown fires for each; that
  # is expected.
  - job_name: "identity-service"
    static_configs:
      - targets: ["identity-service:10300"]
    metrics_path: /actuator/prometheus

  - job_name: "customer-service"
    static_configs:
      - targets: ["customer-service:10301"]
    metrics_path: /actuator/prometheus

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:10302"]
    metrics_path: /actuator/prometheus

  - job_name: "product-service"
    static_configs:
      - targets: ["product-service:10303"]
    metrics_path: /actuator/prometheus

  - job_name: "shopping-cart-service"
    static_configs:
      - targets: ["shopping-cart-service:10304"]
    metrics_path: /actuator/prometheus

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:10305"]
    metrics_path: /actuator/prometheus

# Remote write for receiving metrics from Tempo
remote_write: []
