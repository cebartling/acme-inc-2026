# =============================================================================
# Prometheus Alerting Rules
# Basic infrastructure health alerts
# =============================================================================

groups:
  - name: infrastructure
    rules:
      # Service down alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      # High JVM heap usage (Micrometer emits jvm_memory_*, not process_resident_memory_bytes)
      - alert: HighMemoryUsage
        expr: |
          sum by (job) (jvm_memory_used_bytes{area="heap"})
            / sum by (job) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High heap usage on {{ $labels.job }}"
          description: "{{ $labels.job }} is using {{ $value | humanizePercentage }} of its max heap."

  - name: orders
    rules:
      # A customer got a 503 and the abandoned-order job later submitted their order (ADR-0062)
      - alert: OrderRecoveredLostConvert
        expr: increase(orders_recovered_total{reason="LOST_CONVERT"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Order service recovered a lost convert"
          description: "A customer saw a failure at checkout and the abandoned-order job submitted the order. See documentation/adrs/0062-cancel-abandoned-orders.md."

  - name: kafka
    rules:
      # Kafka consumer lag
      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag detected"
          description: "Consumer group {{ $labels.consumer_group }} has lag of {{ $value }} messages."

  - name: observability
    rules:
      # Loki ingestion rate
      - alert: LokiHighIngestionRate
        expr: rate(loki_distributor_bytes_received_total[5m]) > 10485760
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High log ingestion rate"
          description: "Loki is receiving more than 10MB/s of logs."

      # Tempo trace ingestion
      - alert: TempoHighTraceIngestion
        expr: rate(tempo_distributor_spans_received_total[5m]) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High trace ingestion rate"
          description: "Tempo is receiving more than 10000 spans/s."
