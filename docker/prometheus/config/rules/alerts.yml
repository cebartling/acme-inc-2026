# =============================================================================
# Prometheus Alerting Rules
# Infrastructure health and order-service alerts
# =============================================================================

groups:
  - name: infrastructure
    rules:
      # Service down alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      # JVM services (Micrometer emits jvm_memory_*, not process_resident_memory_bytes).
      # Fixed 512MB, not a share of max heap: order-service has no container memory limit,
      # so max heap is ~75% of host RAM. The 5m minimum is the heap floor after GC, so the
      # G1 sawtooth can't reset the alert; it fires only when live data stays above 512MB.
      - alert: HighMemoryUsage
        expr: |
          min_over_time(sum by (job) (jvm_memory_used_bytes{area="heap"})[5m:1m]) / 1024 / 1024 > 512
        labels:
          severity: warning
        annotations:
          summary: "High heap usage on {{ $labels.job }}"
          description: "{{ $labels.job }} has held more than 512MB of heap for 5 minutes."

      # Non-JVM services (Prometheus, Grafana, Loki, Tempo): the original resident-memory rule.
      - alert: HighProcessMemoryUsage
        expr: |
          (process_resident_memory_bytes / 1024 / 1024) > 512
            unless on (job, instance) jvm_memory_used_bytes{area="heap"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "{{ $labels.job }} is using more than 512MB of memory."

  - name: orders
    rules:
      # A customer got a 503 and the abandoned-order job later submitted their order (ADR-0062)
      - alert: OrderRecoveredLostConvert
        # increase() needs a prior sample, so a series first scraped already above 0 (Prometheus
        # started after the order service, or lost its data) is caught by the second clause.
        expr: |
          increase(orders_recovered_total{reason="LOST_CONVERT"}[1h]) > 0
            or
          (orders_recovered_total{reason="LOST_CONVERT"} > 0 unless orders_recovered_total{reason="LOST_CONVERT"} offset 1h)
        labels:
          severity: warning
        annotations:
          summary: "Order service recovered a lost convert"
          description: "A convert's answer was lost between the order service and the cart, and the abandoned-order job submitted the order afterwards. The job logs a warning for each recovery in the order-service logs. See documentation/adrs/0062-cancel-abandoned-orders.md."

  - name: kafka
    rules:
      # Kafka consumer lag
      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag detected"
          description: "Consumer group {{ $labels.consumer_group }} has lag of {{ $value }} messages."

  - name: observability
    rules:
      # Loki ingestion rate
      - alert: LokiHighIngestionRate
        expr: rate(loki_distributor_bytes_received_total[5m]) > 10485760
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High log ingestion rate"
          description: "Loki is receiving more than 10MB/s of logs."

      # Tempo trace ingestion
      - alert: TempoHighTraceIngestion
        expr: rate(tempo_distributor_spans_received_total[5m]) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High trace ingestion rate"
          description: "Tempo is receiving more than 10000 spans/s."
