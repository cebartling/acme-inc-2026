server:
  port: 10303

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acme_products}
    username: ${POSTGRES_USER:acme}
    password: ${POSTGRES_PASSWORD:acme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # PIN-302: reject {"pageSize": 24.9} with a 400 instead of truncating it to 24. Applies to
      # every integer field of every request body, and rejects 24.0 too. Same as shopping-cart (PIN-279).
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.in.flight.requests.per.connection: 1
        enable.idempotence: true
        retries: 3
    consumer:
      # The catalog projector's group (PIN-550); the analytics events are only produced
      group-id: product-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mongodb:
    # On AWS the URI carries the DocumentDB credentials and tls=true (PIN-538, ADR-0064)
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DB:acme_query}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

product:
  catalog:
    # Debezium's row changes of the four catalog tables, for the read model's projector (PIN-550)
    topic-prefix: product.public.
    # Set false to keep the projector's listener from starting (tests without Kafka)
    listener-enabled: ${PRODUCT_CATALOG_LISTENER_ENABLED:true}
  events:
    publish:
      timeout-seconds: 10

logging:
  level:
    com.acme.product: DEBUG
