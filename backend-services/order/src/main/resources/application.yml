server:
  port: 10305

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acme_orders}
    # acme_orders and acme_app come from docker/postgres/init (like customer and notification)
    username: ${POSTGRES_USER:acme_app}
    password: ${POSTGRES_PASSWORD:acme_app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    # Like the other services (PIN-296): no JPA session outlives a use case's transaction.
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Like the cart (PIN-279): reject a decimal in an integer field with a 400 instead of
      # truncating it. Only affects Spring MVC's Jackson 3 mapper.
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

acme:
  order:
    events:
      publish-timeout-seconds: 10
