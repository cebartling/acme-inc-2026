server:
  port: 10305

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acme_orders}
    # acme_orders and acme_app come from docker/postgres/init (like customer and notification)
    username: ${POSTGRES_USER:acme_app}
    password: ${POSTGRES_PASSWORD:acme_app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    # Like the other services (PIN-296): no JPA session outlives a use case's transaction.
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Like the cart (PIN-279): reject a decimal in an integer field with a 400 instead of
      # truncating it. Only affects Spring MVC's Jackson 3 mapper.
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  task:
    scheduling:
      pool:
        # One thread per job (outbox relay, abandoned orders), so the relay blocked on Kafka
        # never holds up the other. The default is a single shared thread.
        size: 2
  security:
    oauth2:
      resourceserver:
        # Verifies identity's access_token cookie, as the cart does (ADR-0043): signature
        # against identity's public keys, plus exp, iss and aud. Keys are re-fetched when a
        # token carries an unknown kid (identity regenerates its keys on restart).
        jwt:
          jwk-set-uri: ${ACME_IDENTITY_JWKS_URI:http://localhost:10300/.well-known/jwks.json}
          # Must match identity's identity.jwt.issuer / audience (same env var names).
          issuer-uri: ${JWT_ISSUER:https://auth.acme.com}
          audiences: ${JWT_AUDIENCE:https://api.acme.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

acme:
  # The cart service, read and converted on the customer's behalf (PIN-366)
  cart:
    base-url: ${CART_SERVICE_URL:http://localhost:10304}
    # The shared secret the cart requires to read a checkout session or convert a cart
    # (PIN-382). No default: the service won't start without it.
    service-token: ${ACME_ORDER_SERVICE_TOKEN:}
  order:
    events:
      publish-timeout-seconds: 10
    # OutboxRelay (PIN-368): how often it polls, after how many failed sends of one message
    # it logs errors (it never gives up), and how many messages one poll sends
    outbox:
      poll-delay-ms: 1000
      alert-after-attempts: 5
      batch-size: 100
    abandoned:
      # The job that cancels orders left PENDING (PIN-427); ISO-8601 durations. max-age must be
      # longer than the cart's checkout session plus its unlock grace and interval: the service
      # won't start otherwise. One run cancels at most batch-size orders.
      enabled: ${ACME_ORDER_ABANDONED_ENABLED:true}
      max-age: ${ACME_ORDER_ABANDONED_MAX_AGE:PT1H}
      initial-delay: ${ACME_ORDER_ABANDONED_INITIAL_DELAY:PT5M}
      interval: ${ACME_ORDER_ABANDONED_INTERVAL:PT5M}
      batch-size: ${ACME_ORDER_ABANDONED_BATCH_SIZE:100}
