server:
  port: 10304

spring:
  application:
    name: shopping-cart-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acme_carts}
    username: ${POSTGRES_USER:acme}
    password: ${POSTGRES_PASSWORD:acme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        # Verifies identity's access_token cookie (US-0004-08): signature against identity's
        # public keys, plus exp, iss and aud. Keys are re-fetched when a token carries an
        # unknown kid (identity regenerates its keys on restart).
        jwt:
          jwk-set-uri: ${ACME_IDENTITY_JWKS_URI:http://localhost:10300/.well-known/jwks.json}
          # Must match identity's identity.jwt.issuer / audience (same env var names).
          # With jwk-set-uri set, issuer-uri is only compared to `iss`; nothing is discovered.
          issuer-uri: ${JWT_ISSUER:https://auth.acme.com}
          audiences: ${JWT_AUDIENCE:https://api.acme.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

acme:
  cart:
    # Upper bound on a single variant's quantity in one cart (AC-0004-06-05)
    max-order-quantity: 10
    events:
      publish-timeout-seconds: 10
    cookie:
      # Browsers accept Secure cookies from http://localhost, so this stays on locally
      secure: ${ACME_CART_COOKIE_SECURE:true}
    # A guest session's lifetime since its last cart request: the cookie's Max-Age, and how
    # long an ACTIVE guest cart may sit idle before it expires (PIN-287)
    guest-ttl: ${ACME_CART_GUEST_TTL:30d}
    expiry:
      # The idle guest cart job (PIN-287); ISO-8601 durations
      enabled: ${ACME_CART_EXPIRY_ENABLED:true}
      initial-delay: ${ACME_CART_EXPIRY_INITIAL_DELAY:PT5M}
      interval: ${ACME_CART_EXPIRY_INTERVAL:PT1H}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:10303}

logging:
  level:
    com.acme.cart: DEBUG
