server:
  port: 10304

spring:
  application:
    name: shopping-cart-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acme_carts}
    username: ${POSTGRES_USER:acme}
    password: ${POSTGRES_PASSWORD:acme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

acme:
  cart:
    # Upper bound on a single variant's quantity in one cart (AC-0004-06-05)
    max-order-quantity: 10
    events:
      publish-timeout-seconds: 10
    cookie:
      # Browsers accept Secure cookies from http://localhost, so this stays on locally
      secure: ${ACME_CART_COOKIE_SECURE:true}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:10303}
  identity:
    # Public signing keys for verifying the access_token cookie (US-0004-08)
    jwks-uri: ${ACME_IDENTITY_JWKS_URI:http://localhost:10300/.well-known/jwks.json}
    # Must match identity's identity.jwt.issuer / audience (same env var names)
    issuer: ${JWT_ISSUER:https://auth.acme.com}
    audience: ${JWT_AUDIENCE:https://api.acme.com}

logging:
  level:
    com.acme.cart: DEBUG
